#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# SSOwat injects YNH_USER_EMAIL, whose name contains underscores; nginx drops such
# headers by default. Enable them here (server context — not allowed inside location)
# so the value is readable as $http_ynh_user_email below.
underscores_in_headers on;

location __PATH__/ {

    # MeshMonitor knows its own BASE_URL, so the full path is forwarded (not stripped).
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;

    # --- YunoHost SSO (SSOwat header auth) ---
    # SSOwat injects YNH_USER_EMAIL after portal login. Normalize it into a clean
    # hyphenated Remote-User header that MeshMonitor's proxy auth reads
    # (PROXY_AUTH_HEADER_EMAIL=Remote-User in .env). Setting it from $http_ynh_user_email
    # overrides any client-supplied Remote-User, preventing identity spoofing.
    proxy_set_header Remote-User   $http_ynh_user_email;
    proxy_set_header Remote-Groups "";

    # WebSocket / socket.io support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Allow large payloads (firmware OTA uploads, backups)
    client_max_body_size 200M;
    proxy_read_timeout 300s;
    # Note: MeshMonitor sets its own security headers (CSP etc.) via helmet.
}
